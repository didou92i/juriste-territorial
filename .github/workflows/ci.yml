name: tests et distribution
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.11.2'
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen pytest
      - run: uv run --frozen python scripts/check_distribution.py
      - run: uv run --frozen python scripts/evaluate_benchmark.py
      - run: uv run --frozen droit-territorial case-schema > /tmp/dossier-schema.json
      - run: uv build
      - run: uv run --frozen python scripts/package_skill.py
